<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배움나눔 | 교내 연수 신청</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#18342c;background:#f5f8f6}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#126b52,#219674);color:white;padding:32px max(20px,calc((100vw - 1080px)/2))}header h1{margin:0;font-size:30px}header p{opacity:.9;margin:8px 0 0}.wrap{max-width:1080px;margin:auto;padding:24px 16px 70px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button{background:white;color:#176b52;border:1px solid #d6e4dd}.tabs button.active{background:#176b52;color:white}button{cursor:pointer;border:0;border-radius:10px;padding:11px 17px;font-weight:700;font-size:14px;background:#17785c;color:white}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e8f2ee;color:#176b52}input,select{border:1px solid #d3ded8;border-radius:10px;padding:12px;width:100%;font:inherit;background:white}input:focus,select:focus{outline:2px solid #9ad8bd}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.card,.panel{background:white;border:1px solid #e0e9e3;border-radius:16px;box-shadow:0 3px 12px #18342c09}.stat{padding:18px}.stat strong{display:block;font-size:27px;margin-top:7px;color:#147456}.muted{color:#6b8075;font-size:13px}.filters{display:grid;grid-template-columns:1fr 210px auto;gap:10px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:22px}.card h3{margin:10px 0;font-size:20px}.tag{display:inline-block;background:#e6f4ee;color:#167454;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700}.tag.full{background:#fff0e8;color:#a7542a}.detail{color:#566e62;font-size:14px;line-height:1.9}.desc{font-size:14px;line-height:1.65;min-height:42px}.progress{height:8px;border-radius:20px;background:#e9f1ed;overflow:hidden;margin:14px 0 8px}.progress>div{height:100%;background:#22a479}.cardfooter{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.panel{padding:22px;margin-top:15px}.panel h2{margin-top:0}.formline{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:600px}.listrow{padding:15px 0;border-bottom:1px solid #e5eee8;display:flex;justify-content:space-between;align-items:center;gap:10px}.listrow:last-child{border:0}.notice{background:#fff9e8;border:1px solid #f2e1ad;padding:12px 15px;border-radius:10px;font-size:13px;line-height:1.6;margin:14px 0}.error{color:#b43232}.success{color:#11734c}.hidden{display:none!important}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#183b2e;color:white;padding:13px 20px;border-radius:12px;box-shadow:0 8px 30px #0003;max-width:90vw;z-index:20}dialog{border:0;border-radius:16px;padding:26px;max-width:420px;width:calc(100% - 32px);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#0b241d88}dialog h2{margin-top:0}dialog form{display:grid;gap:13px}.actions{display:flex;justify-content:flex-end;gap:8px}.foot{margin-top:35px;font-size:12px;color:#6b8075;line-height:1.7}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters button{width:100%}.cardfooter{align-items:flex-start}header h1{font-size:25px}.formline{grid-template-columns:1fr}.listrow{align-items:flex-start;flex-direction:column}}
</style></head><body><header><h1>🌿 배움나눔</h1><p>함께 배우고 성장하는 교내 연수 · 수업 나눔 플랫폼</p></header><main class="wrap"><nav class="tabs"><button class="active" data-tab="trainings">연수 둘러보기</button><button data-tab="mine">신청 내역 · 취소</button><button data-tab="dashboard">운영 현황</button></nav><div id="connection" class="notice">Supabase 연결 정보를 확인하고 있습니다.</div><section id="trainings"><div class="stats" id="stats"></div><div class="filters"><input id="search" placeholder="연수명, 담당자, 장소 검색" aria-label="연수 검색"><select id="category"><option value="">모든 연수 유형</option><option>교내 연수</option><option>수업 나눔</option><option>공개수업</option><option>워크숍</option></select><button id="reload">새로고침 ↻</button></div><div id="cards" class="cards"></div></section><section id="mine" class="hidden"><div class="panel"><h2>내 신청 내역 확인</h2><p class="muted">신청 시 사용한 이름을 입력하세요. 실습용으로 본인 인증은 제공하지 않습니다.</p><div class="formline"><input id="myName" placeholder="예: 홍길동" maxlength="40"><button id="lookup">신청 내역 검색</button></div><div id="myResults"></div></div></section><section id="dashboard" class="hidden"><div class="panel"><h2>연수 운영 현황</h2><p class="muted">데이터베이스에 저장된 실시간 집계입니다.</p><div class="stats" id="dashStats"></div><div id="dashRows"></div></div></section><div class="foot">대학원 실습용 웹앱입니다. 실제 교사 이름·개인정보를 입력하지 마세요. 로그인 없이 신청 내역 조회 및 취소가 가능하므로 실제 학교 운영에는 사용할 수 없습니다. 연수 등록·수정은 Supabase 관리 화면에서 진행합니다.</div></main><dialog id="applyDialog"><form id="applyForm"><h2 id="applyTitle">연수 신청</h2><p id="applyInfo" class="muted"></p><label for="teacherName">신청자 이름 (가상 이름 사용)</label><input id="teacherName" required minlength="2" maxlength="40" autocomplete="off" placeholder="예: 홍길동"><div class="actions"><button type="button" class="secondary" id="closeDialog">닫기</button><button type="submit" id="submitApply">신청하기</button></div></form></dialog><div id="toast" class="hidden" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// 아래 두 값만 Supabase 대시보드에서 복사하여 붙여 넣으세요.
const SUPABASE_URL = 'https://kokfsljflrkzcpzkvzog.supabase.co';
const SUPABASE_KEY = 'sb_publishable_58qChwrr2oIIgrPGs3ns9Q_hPY_P59c';
const $=id=>document.getElementById(id);let db,trainings=[],applications=[],selectedId=null;const now=()=>new Date();
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),4000)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}
function started(t){return new Date(`${t.training_date}T${t.start_time}`)<=now()}
function count(id){return applications.filter(a=>a.training_id===id).length}
function errorMessage(e){if(e?.code==='23505')return '이미 신청한 연수입니다.';if(e?.code==='23503')return '연수를 찾을 수 없습니다.';if(e?.code==='42501')return '데이터 접근 권한(RLS)을 확인하세요.';if(e?.message?.includes('모집 정원'))return '모집 정원이 마감되었습니다.';if(e?.message?.includes('이미 시작'))return '이미 시작된 연수는 신청할 수 없습니다.';return e?.message||'알 수 없는 오류가 발생했습니다.'}
async function load(){if(!db)return;try{const [t,a]=await Promise.all([db.from('trainings').select('*').order('training_date',{ascending:true}),db.from('applications').select('id,training_id,teacher_name,created_at')]);if(t.error)throw t.error;if(a.error)throw a.error;trainings=t.data||[];applications=a.data||[];$('connection').classList.add('hidden');render();}catch(e){$('connection').classList.remove('hidden');$('connection').textContent='데이터 조회 오류: '+errorMessage(e)}}
function render(){const total=applications.length,cap=trainings.reduce((s,t)=>s+t.capacity,0),open=trainings.filter(t=>!started(t)&&count(t.id)<t.capacity).length;const values=[['전체 연수',trainings.length+'개'],['모집 중',open+'개'],['총 신청',total+'건'],['전체 모집률',cap?Math.round(total/cap*100)+'%':'0%']];const html=values.map(([label,v])=>`<div class="stat"><span class="muted">${label}</span><strong>${v}</strong></div>`).join('');$('stats').innerHTML=html;$('dashStats').innerHTML=html;renderCards();renderDashboard();}
function renderCards(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;const filtered=trainings.filter(t=>(!cat||t.category===cat)&&[t.title,t.instructor,t.location,t.description].some(v=>String(v||'').toLowerCase().includes(q)));$('cards').innerHTML=filtered.length?filtered.map(t=>{const n=count(t.id),full=n>=t.capacity,past=started(t),pct=Math.min(100,n/t.capacity*100);return `<article class="card"><span class="tag ${full||past?'full':''}">${past?'종료':full?'모집 마감':'모집 중'}</span><h3>${escapeHtml(t.title)}</h3><div class="detail">📅 ${fmtDate(t.training_date)} · ${escapeHtml(String(t.start_time).slice(0,5))}~${escapeHtml(String(t.end_time).slice(0,5))}<br>📍 ${escapeHtml(t.location)} · 👤 ${escapeHtml(t.instructor)}<br>🏷️ ${escapeHtml(t.category)}</div><p class="desc">${escapeHtml(t.description)}</p><div class="progress"><div style="width:${pct}%"></div></div><span class="muted">${n} / ${t.capacity}명 신청 · 잔여 ${Math.max(0,t.capacity-n)}명</span><div class="cardfooter"><span class="muted">${past?'신청 기간 종료':full?'정원 마감':'신청 가능'}</span><button data-apply="${t.id}" ${full||past?'disabled':''}>신청하기</button></div></article>`}).join(''):'<p class="muted">검색 조건에 맞는 연수가 없습니다.</p>'}
function renderDashboard(){$('dashRows').innerHTML=trainings.map(t=>{const n=count(t.id);return `<div class="listrow"><div><strong>${escapeHtml(t.title)}</strong><div class="muted">${fmtDate(t.training_date)} · ${escapeHtml(t.category)}</div></div><strong>${n}/${t.capacity}명 (${Math.round(n/t.capacity*100)}%)</strong></div>`}).join('')||'<p class="muted">등록된 연수가 없습니다.</p>'}
function renderMine(){const name=$('myName').value.trim();if(!name){$('myResults').innerHTML='<p class="muted">이름을 입력해 주세요.</p>';return}const mine=applications.filter(a=>a.teacher_name===name);$('myResults').innerHTML=mine.length?mine.map(a=>{const t=trainings.find(t=>t.id===a.training_id);return `<div class="listrow"><div><strong>${escapeHtml(t?.title||'삭제된 연수')}</strong><div class="muted">${t?fmtDate(t.training_date):''} · ${escapeHtml(a.teacher_name)}</div></div><button class="secondary" data-cancel="${a.id}">신청 취소</button></div>`}).join(''):'<p class="muted">해당 이름으로 신청한 내역이 없습니다.</p>'}
function openApply(id){const t=trainings.find(x=>x.id===id);if(!t||started(t)||count(id)>=t.capacity){toast('신청할 수 없는 연수입니다.');return}selectedId=id;$('applyTitle').textContent=t.title;$('applyInfo').textContent=`${fmtDate(t.training_date)} · ${t.location} · 잔여 ${t.capacity-count(id)}명`;$('teacherName').value='';$('applyDialog').showModal();$('teacherName').focus()}
async function apply(e){e.preventDefault();const name=$('teacherName').value.trim(),btn=$('submitApply');if(name.length<2||name.length>40){toast('이름은 2~40자로 입력해 주세요.');return}btn.disabled=true;try{const {error}=await db.from('applications').insert({training_id:selectedId,teacher_name:name});if(error)throw error;$('applyDialog').close();toast('연수 신청이 완료되었습니다.');await load()}catch(err){toast(errorMessage(err));await load()}finally{btn.disabled=false}}
async function cancel(id){if(!confirm('이 신청을 취소하시겠습니까?'))return;try{const {error}=await db.from('applications').delete().eq('id',id);if(error)throw error;toast('신청을 취소했습니다.');await load();renderMine()}catch(e){toast('취소 실패: '+errorMessage(e))}}
for(const btn of document.querySelectorAll('[data-tab]'))btn.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));for(const id of ['trainings','mine','dashboard'])$(id).classList.toggle('hidden',id!==btn.dataset.tab);if(btn.dataset.tab==='mine')renderMine()});$('search').addEventListener('input',renderCards);$('category').addEventListener('change',renderCards);$('reload').addEventListener('click',load);$('lookup').addEventListener('click',renderMine);$('myName').addEventListener('keydown',e=>{if(e.key==='Enter')renderMine()});$('applyForm').addEventListener('submit',apply);$('closeDialog').addEventListener('click',()=>$('applyDialog').close());document.addEventListener('click',e=>{const a=e.target.closest('[data-apply]'),c=e.target.closest('[data-cancel]');if(a)openApply(Number(a.dataset.apply));if(c)cancel(Number(c.dataset.cancel))});
if(SUPABASE_URL.includes('YOUR_')||SUPABASE_KEY.includes('YOUR_')){$('connection').textContent='연결 전: index.html 상단의 SUPABASE_URL과 SUPABASE_KEY를 입력하세요.';render()}else if(!window.supabase){$('connection').textContent='Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'}else{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);load()}
</script></body></html>
